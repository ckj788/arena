<svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 100 100" fill="none">
  <!-- Static version of ClashLogo: same shapes, palette and two-thirds inset. -->
  <rect x="0.5" y="0.5" width="99" height="99" rx="22" fill="#111114" stroke="#27272A" stroke-opacity="0.8" />
  <svg x="16.6667" y="16.6667" width="66.6666" height="66.6666" viewBox="0 0 100 100">
    <defs>
      <linearGradient id="logo-cyan" x1="0%" y1="0%" x2="100%" y2="100%">
        <stop offset="0%" stop-color="#22D3EE" />
        <stop offset="100%" stop-color="#0891B2" />
      </linearGradient>
      <linearGradient id="logo-purple" x1="0%" y1="0%" x2="100%" y2="100%">
        <stop offset="0%" stop-color="#C084FC" />
        <stop offset="100%" stop-color="#7C3AED" />
      </linearGradient>
      <linearGradient id="logo-gold" x1="0%" y1="0%" x2="100%" y2="100%">
        <stop offset="0%" stop-color="#FDE047" />
        <stop offset="100%" stop-color="#D97706" />
      </linearGradient>
    </defs>
    <path d="M45 15 L20 40 L45 65 Z" fill="url(#logo-cyan)" opacity="0.95" />
    <path d="M55 35 L80 60 L55 85 Z" fill="url(#logo-purple)" opacity="0.95" />
    <polygon points="45,40 55,30 55,48 45,58" fill="url(#logo-gold)" />
    <circle cx="50" cy="45" r="3.5" fill="#FFFFFF" />
  </svg>
</svg>
